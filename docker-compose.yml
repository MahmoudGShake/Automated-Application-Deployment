version: "3.9"
services:
  web:
    image: ${IMAGE_NAME:-ghcr.io/mahmoudgshake/automated-application-deployment}:${IMAGE_TAG:-latest}
    container_name: diginnocent
    env_file:
      - .env
    ports:
      - "80:8000"
    volumes:
      - ./media:/app/media
      - ./static:/app/static
      - ./db.sqlite3:/app/db.sqlite3
    restart: unless-stopped