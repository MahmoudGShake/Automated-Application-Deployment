version: "3.9"

services:
  web:
    build: .
    container_name: diginnocent
    env_file:
      - .env
    ports:
      - "80:8000"
    volumes:
      - ./media:/app/media
      - ./static:/app/static
      - ./db.sqlite3:/app/db.sqlite3
    command: /bin/sh -c "python manage.py collectstatic --noinput && /usr/bin/supervisord && python manage.py runserver"
