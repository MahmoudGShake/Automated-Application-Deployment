- name: A playbook for installing docker and running the Application
  hosts: depi-app
  gather_facts: yes
  become: yes
  tasks:
    - name: Install required packages (Ubuntu)
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - git
          - lsb-release
        state: present
        update_cache: yes

    - name: Create keyrings directory
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Download Docker GPG key
      get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'

    - name: Get Ubuntu codename
      shell: . /etc/os-release && echo "${UBUNTU_CODENAME:-$VERSION_CODENAME}"
      register: ubuntu_codename
      changed_when: false
      check_mode: no

    - name: Add Docker repository
      copy:
        dest: /etc/apt/sources.list.d/docker.sources
        content: |
          Types: deb
          URIs: https://download.docker.com/linux/ubuntu
          Suites: {{ ubuntu_codename.stdout }}
          Components: stable
          Signed-By: /etc/apt/keyrings/docker.asc
        mode: '0644'

    - name: Update apt cache after adding Docker repo
      apt:
        update_cache: yes

    - name: Install Docker packages
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present

    - name: Start and enable Docker service
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Add ubuntu user to docker group
      user:
        name: ubuntu
        groups: docker
        append: yes

    - name: Create application directory
      file:
        path: /opt/diginnocent
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'

    - name: Git checkout
      ansible.builtin.git:
        repo: 'https://github.com/MahmoudGShake/Automated-Application-Deployment.git'
        dest: /opt/diginnocent
        version: main
        force: yes
      become_user: ubuntu

    - name: Login to GitHub Container Registry
      community.docker.docker_login:
        registry_url: ghcr.io
        username: ${{ github.actor }}
        password: "{{ github_token }}"
        reauthorize: yes
      become_user: ubuntu

    - name: Create .env file
      copy:
        dest: /opt/diginnocent/.env
        content: |
          DEBUG=False
          SECRET_KEY={{ lookup('env', 'DJANGO_SECRET_KEY') | default('change-me-in-production', true) }}
          ALLOWED_HOSTS=*
          DATABASE_URL=sqlite:///db.sqlite3
        owner: ubuntu
        group: ubuntu
        mode: '0600'

    - name: Pull latest Docker image
      community.docker.docker_image:
        name: "{{ image_name }}"
        tag: "{{ image_tag }}"
        source: pull
        force_source: yes
      become_user: ubuntu

    - name: Stop existing containers
      community.docker.docker_compose_v2:
        project_src: /opt/diginnocent
        state: absent
      become_user: ubuntu
      ignore_errors: yes

    - name: Start the app with docker compose
      community.docker.docker_compose_v2:
        project_src: /opt/diginnocent
        state: present
        pull: always
      become_user: ubuntu
      environment:
        IMAGE_NAME: "{{ image_name }}"
        IMAGE_TAG: "{{ image_tag }}"