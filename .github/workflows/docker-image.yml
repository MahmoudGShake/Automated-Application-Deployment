name: CI pipeline to build and push Docker images
on:
  push:
    branches: [ "main", "feature/EhabEdits" ]
  pull_request:
    branches: [ "main" ]
env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write  
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      
      - name: Build Docker image
        run: |
          IMAGE_NAME_LOWER=$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          docker build -t $IMAGE_NAME_LOWER:latest -t $IMAGE_NAME_LOWER:${{ github.sha }} .
      
      - name: Push Docker image
        run: |
          IMAGE_NAME_LOWER=$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          docker push $IMAGE_NAME_LOWER:latest
          docker push $IMAGE_NAME_LOWER:${{ github.sha }}
          
      - name: Install Ansible
        run: |
          sudo apt update
          sudo apt install -y ansible
  
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts
  
      - name: Deploy with Ansible
        run: |
          IMAGE_NAME_LOWER=$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          ansible-playbook -i ansible/inventory.yml ansible/playbook.yaml \
            --extra-vars "image_name=$IMAGE_NAME_LOWER image_tag=${{ github.sha }}"
